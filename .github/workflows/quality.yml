name: Fan Edition quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/story-expansion-korean-v1, release-1-0-scene-soundtrack]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
